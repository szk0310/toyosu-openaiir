			<div class="h-bg">
				<h2 class="h-ttl">表示順変更</h2>
			</div>
			<div>				<draggable
				  v-model="appSpaceImageArray"
				  item-key="id"
				  tag="ul"
				  group="ITEMS"
				  class="manage-order-list-wrap"
				>
				  <template #item="{ element, index }">
					<div class="manage-order-list">
					  <p>
						<span>{{ index + 1 }}</span><br>
						<img
						  :src="'../../assets/upload_img/facility/space/' + element.name"
						  :alt="'image' + (index + 1)"
						>
					  </p>
					</div>
				  </template>
				</draggable>
			</div>
			<br>
			
			<div class="manage-order-btn"><input type="button" id="" value="保存する"  @click="saveOrder()"  class="new-btn"></div>
			<br>

<br>
