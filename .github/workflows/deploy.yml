# ============================================================
#  CPI サーバーへの自動デプロイ（FTPS / 明示的SSL）
#
#  ※ このサーバー(toyosu-smartcity.com / CPI)は SFTP(22) 不可、
#     FTPS（明示的SSL・証明書検証オフ）で接続できることを確認済み。
#     認証情報・データは SSL で暗号化して転送する。
#
#  対応関係（親フォルダ <ROOT> = FTP_REMOTE_ROOT）:
#    - リポジトリ直下の管理画面ファイル一式  → <ROOT>/manage/
#    - _public/                              → <ROOT>/          （公開サイト）
#    - _shared-config/assets/js/common/firestore_openAir.js
#                                            → <ROOT>/assets/js/common/firestore_openAir.js
#    公開URL: http://toyosu-smartcity.com/<ROOT>/manage/facility/login.html
#
#  必要な GitHub Secrets（Settings → Secrets and variables → Actions）:
#    FTP_HOST         接続先ホスト名（例: toyosu-smartcity.com）
#    FTP_USER         FTP ユーザー名（例: smartcity_ftp）
#    FTP_PASS         パスワード
#    FTP_REMOTE_ROOT  manage/ の1つ上の階層のパス。FTPホームからの相対でも可
#                     （例: openair  → /openair/manage/ と /openair/assets/... に配置）
#    FTP_PORT         （任意）FTP ポート。未設定なら 21
#    MAPBOX_TOKEN     公開サイトの地図(map.html)で使うアクセストークン
#
#  トリガー:
#    - 手動実行（Actions タブの「Run workflow」ボタン）
#    - main への push（PR #1 をマージした瞬間に自動反映）
# ============================================================
name: Deploy to CPI (FTPS)

on:
  workflow_dispatch:
  push:
    branches: [main]

# 同時に複数のデプロイが走らないように直列化
concurrency:
  group: deploy-cpi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Mapbox 設定ファイルを生成
        # アクセストークンはリポジトリに置かず、ここで生成して配信する。
        # 生成物 _public/assets/js/common/mapbox_config.js は .gitignore 済み。
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MAPBOX_TOKEN}" ]; then
            echo "::error::Secret MAPBOX_TOKEN が未設定です。map.html の地図が表示されません。"
            exit 1
          fi
          mkdir -p _public/assets/js/common
          printf 'window.MAPBOX_TOKEN = "%s";\n' "${MAPBOX_TOKEN}" \
            > _public/assets/js/common/mapbox_config.js
          echo "mapbox_config.js を生成しました"

      - name: Deploy via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_REMOTE_ROOT: ${{ secrets.FTP_REMOTE_ROOT }}
        run: |
          set -euo pipefail

          if [ -z "${FTP_HOST}" ] || [ -z "${FTP_USER}" ] || [ -z "${FTP_PASS}" ] || [ -z "${FTP_REMOTE_ROOT}" ]; then
            echo "::error::必要な Secrets（FTP_HOST / FTP_USER / FTP_PASS / FTP_REMOTE_ROOT）が未設定です。"
            exit 1
          fi

          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            set net:max-retries 2;
            set net:timeout 20;
            open -u '${FTP_USER}','${FTP_PASS}' ftp://${FTP_HOST}:${FTP_PORT};

            # (1) 管理画面ファイル一式 → <ROOT>/manage/
            #     -R = アップロード方向 / --only-newer = 更新分のみ / 不要ファイルは除外
            mirror -R --only-newer --parallel=4 \
              --exclude '(^|/)\.git' \
              --exclude '(^|/)\.github/' \
              --exclude '(^|/)_shared-config/' \
              --exclude '(^|/)_public/' \
              --exclude '(^|/)_public-site-notes/' \
              --exclude '(^|/)\.DS_Store$' \
              --exclude '(^|/)\.gitignore$' \
              --exclude '\.md$' \
              --exclude '(^|/)firestore\.rules$' \
              --exclude '(^|/)firebase\.json$' \
              ./ '${FTP_REMOTE_ROOT}/manage/';

            # (2) 公開サイト → <ROOT>/
            #     ★ upload_img/ は実行時にアップロードされる画像なので同期しない。
            #       同期するとリポジトリ側の古い状態で本番の投稿画像を上書きしてしまう。
            #     ★ assets/js/common/{firestore_openAir.js,vue.js} は
            #       _shared-config/ を正本とするため、ここでは送らない。
            mirror -R --only-newer --parallel=4 \
              --exclude '(^|/)upload_img/' \
              --exclude '(^|/)\.DS_Store$' \
              --exclude '(^|/)assets/js/common/firestore_openAir\.js$' \
              --exclude '(^|/)assets/js/common/vue\.js$' \
              ./_public/ '${FTP_REMOTE_ROOT}/';

            # (3) 親階層の共有アセット一式 → <ROOT>/assets/
            #     firestore_openAir.js / vue.js など、各HTMLが
            #     ../../assets/... で参照するファイル群。
            #     --only-newer なので upload_img/ の投稿画像は削除されない。
            mirror -R --only-newer --parallel=2 \
              --exclude '\.md$' \
              --exclude '(^|/)\.DS_Store$' \
              ./_shared-config/assets/ '${FTP_REMOTE_ROOT}/assets/';

            bye;
          "
          echo "✅ デプロイ完了"
