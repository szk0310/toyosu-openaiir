		<div class="section">

				<div class="contact-wrap">
						<h1 class="sec-ttl">お問い合わせ</h1>
						<p class="sec-seb-txt">サービスに関するご質問、ご意見など<br class="sp">お気軽にご連絡ください。</p>

					<form action="conf.php" method="post" id="contact_form">
						<div class="form-wrap">
							
						<div class="ttl">お問い合わせ種別 <span class="req">必須</span></div>
						<div class="input">
						  <div class="select-wrap">
							  <select name="kind" class="validate[required]">
								<option value="">選択してください</option>
								<option value="サービスについて">サービスについて</option>
								<option value="スペースの掲載について">スペースの掲載について</option>
								<option value="その他">その他</option>
							  </select>
							</div>
						</div>

						<div class="ttl">お名前 <span class="req">必須</span></div>
						<div class="input">
						  <input id="name" type="text" name="name" value="" class="validate[required]" placeholder="例：豊洲 太郎">
						</div>
						
						<div class="ttl">法人名/団体名</div>
						<div class="input">
						  <input id="company" type="text" name="company" value="" class="" placeholder="例：株式会社OPEN AIR">
						</div>

						<div class="ttl">メールアドレス<span class="req">必須</span></div>
						<div class="input">
							<input id="email" type="email" name="email" value="" class="validate[required,custom[email]]" placeholder="例：info@example.com">
						</div>

						<div class="ttl">電話番号</div>
						<div class="input">
						  <input id="tel" type="text" name="tel" value="" class="validate[custom[phone]]" placeholder="例：090-1234-5678">
						</div>

						<div class="ttl">お問い合わせ内容<span class="req">必須</span></div>
						<div class="input">
						  <textarea rows="5" name="inquiry" class="validate[required]" placeholder="こちらにお問い合わせ内容をご記入ください"></textarea>
						</div>

						<div class="check-btn-wrap">
						  <label class="check-agreement">
							<input
							  type="checkbox"
							  name="agreement"
							  id="agreement"
							  value="1"
							  class="validate[required]"
								   data-prompt-position="bottomLeft:-10,-5",
							>
							<span class="checkmark"></span>
							<a href="../privacy.html" target="_blank">プライバシーポリシー</a>に同意します。
						  </label>
						</div>
						
						
						<div class="submit"><input type="submit" value="確認画面へ" class="submit-button btn blue min"></div>
					</div>
					</form>
