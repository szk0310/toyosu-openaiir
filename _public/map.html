<script>
// アクセストークンはリポジトリに置かない。デプロイ時に GitHub Secret
// (MAPBOX_TOKEN) から assets/js/common/mapbox_config.js が生成される。
mapboxgl.accessToken = window.MAPBOX_TOKEN;
if (!mapboxgl.accessToken) { console.error("Mapbox のアクセストークンが読み込まれていません"); }
const initialCenter = [139.791221, 35.650561];
//const initialZoom = 14;
const mediaQuery = window.matchMedia('(max-width: 768px)');
const initialZoom = mediaQuery.matches ? 13 : 13;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/standard',
  center: initialCenter,
  zoom: initialZoom,
  minZoom: 12,
  maxZoom: 17
});

let markers = [];
let facilityData = [];
let categoryConfig = [];
let selectedCategories = {}; 

// --- カテゴリJSONロード ---
async function loadCategories() {
  try {
    const res = await fetch('assets/json/categories.json');
    const data = await res.json();
    categoryConfig = data.facility || [];
    categoryConfig.forEach(cat => selectedCategories[cat.field] = []);
    renderCategoryCheckboxes();
  } catch(e) { console.error(e); }
}

// --- カテゴリチェックボックス ---
function renderCategoryCheckboxes() {
  const container = document.getElementById('category-filters');
  container.innerHTML = '';
  categoryConfig.forEach(cat => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'checkbox-group';
    const title = document.createElement('p');
    title.textContent = cat.name + '：';
    groupDiv.appendChild(title);

    // ★ 追加：labelをまとめるラッパー
    const labelWrap = document.createElement('div');
    labelWrap.className = 'label-wrap';

    cat.items.forEach(item => {
      const label = document.createElement('label');

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = item;
      input.dataset.field = cat.field;

      input.addEventListener('change', () => {
        const f = input.dataset.field;
        if (input.checked) {
          if (!selectedCategories[f].includes(item)) {
            selectedCategories[f].push(item);
          }
        } else {
          selectedCategories[f] = selectedCategories[f].filter(v => v !== item);
        }
        updateMarkers();
        updateSidebar();
      });

      const span = document.createElement('span');
      span.textContent = ' ' + item;

      label.appendChild(input);
      label.appendChild(span);

      // ★ ここを変更（groupDiv → labelWrap）
      labelWrap.appendChild(label);
    });

    // ★ 最後にまとめて追加
    groupDiv.appendChild(labelWrap);

    container.appendChild(groupDiv);

  });
}

// --- 施設データロード ---
async function loadFacilityData() {
  const db = firebase.firestore();
  const snapshot = await db.collection("facilityData").where("f_release", "==", "on").get();
  const features = [];

  snapshot.forEach(doc => {
    const d = doc.data();
    if (d.lat && d.lng) {
      const feature = {
        type:"Feature",
        geometry:{type:"Point",coordinates:[d.lng,d.lat]},
        properties:{
          f_id:doc.id,
          name:d.f_name||"名称なし",
          description:d.address||"",
          message:d.f_introduction||"",
          imageId:d.f_icon||"no-image.svg",
          f_image:d.f_image||"",
          url_web:d.url_web||"",
          url_insta:d.url_insta||"",
          url_fb:d.url_fb||"",
          url_x:d.url_x||"",
          iconSize:[40,40],
          categories:{}
        }
      };
      categoryConfig.forEach(cat=>{
        feature.properties.categories[cat.field] = d[cat.field]||[];
      });
      features.push(feature);
    }
  });

  facilityData = features;
  updateMarkers();
  updateSidebar();
}

// --- マーカー更新 ---
function updateMarkers() {
  markers.forEach(m=>m.remove());
  markers=[];
  const bounds = map.getBounds();

  facilityData.forEach(f=>{
    let show=true;
    for(const field in selectedCategories){
      const selected = selectedCategories[field];
      if(selected.length===0) continue;
      const vals = f.properties.categories[field]||[];
      if(!selected.every(v=>vals.includes(v))){
        show=false;
        break;
      }
    }
    if(!bounds.contains(f.geometry.coordinates)) show=false;

    if(show){
      const el=document.createElement('div');
      const [w,h] = f.properties.iconSize;
      el.className='marker';
      el.style.width=`${w}px`;
      el.style.height=`${h}px`;
      el.style.backgroundImage=`url(assets/upload_img/facility/icon/${f.properties.imageId})`;
      el.style.backgroundSize='100%';
      el.addEventListener('click',()=>showInfo(f));
      markers.push(new mapboxgl.Marker(el).setLngLat(f.geometry.coordinates).addTo(map));
    }
  });
}

// --- サイドバー更新 ---
function updateSidebar() {

  const list = document.getElementById('feature-list');
  list.innerHTML='';

  const bounds = map.getBounds();

  const visible = facilityData.filter(f=>{
    for(const field in selectedCategories){
      const selected = selectedCategories[field];
      if(selected.length === 0) continue;

      const vals = f.properties.categories[field] || [];
      if(!selected.every(v => vals.includes(v))) return false;
    }

    return bounds.contains(f.geometry.coordinates);
  });


  if(visible.length === 0){
    const noRes = document.createElement('div');
    noRes.textContent='表示範囲内に施設はありません。';
    list.appendChild(noRes);
    return;
  }


  visible.forEach(f => {

    const item = document.createElement('div');
    item.className = 'feature-item';


    // ===== 画像エリア =====
    const imgWrap = document.createElement('div');
    imgWrap.className = 'feature-img';

    const img = document.createElement('img');
    img.src = "assets/upload_img/facility/icon/" + f.properties.imageId;
    img.alt = f.properties.name || '';

    imgWrap.appendChild(img);


    // ===== テキストエリア =====
    const txtWrap = document.createElement('div');
    txtWrap.className = 'feature-txt';

    const nameP = document.createElement('p');
    nameP.className = 'item_name';
    nameP.textContent = f.properties.name;

    const addrP = document.createElement('p');
    addrP.className = 'item_address';
    addrP.textContent = f.properties.description;

    txtWrap.appendChild(nameP);
    txtWrap.appendChild(addrP);


    // ===== リンクエリア =====
    const linkWrap = document.createElement('div');
    linkWrap.className = 'feature-link';

    const link = document.createElement('a');
    link.href = "facility.html";
    link.className = "side-link";
    link.textContent = "";

    link.addEventListener('click', (e) => {
      e.stopPropagation(); // map.flyTo を止める
      sessionStorage.toyosu_manage_facility_id = f.properties.f_id;
    });

    linkWrap.appendChild(link);


    // ===== まとめて追加 =====
    item.appendChild(imgWrap);
    item.appendChild(txtWrap);
    item.appendChild(linkWrap);


    // 施設クリックでマップ移動
    item.addEventListener('click', () => {

      map.flyTo({
        center: f.geometry.coordinates,
        zoom: 17
      });

      showInfo(f); // infoパネルも表示
    });


    list.appendChild(item);

  });

}
	
	
// --- infoパネル ---
function showInfo(f){
  const info=document.getElementById('info');
  const mainImage = f.properties.f_image ? `assets/upload_img/facility/main/${f.properties.f_image}` : 'assets/upload_img/facility/no-image.svg';
  const snsLinks=[];
  if(f.properties.url_web)snsLinks.push(`<a href="${f.properties.url_web}" target="_blank"><img src="assets/img/common/icon_web.png" alt="Web"></a>`);
  if(f.properties.url_insta)snsLinks.push(`<a href="${f.properties.url_insta}" target="_blank"><img src="assets/img/common/icon_insta.png" alt="Instagram"></a>`);
  if(f.properties.url_fb)snsLinks.push(`<a href="${f.properties.url_fb}" target="_blank"><img src="assets/img/common/icon_fb.png" alt="Facebook"></a>`);
  if(f.properties.url_x)snsLinks.push(`<a href="${f.properties.url_x}" target="_blank"><img src="assets/img/common/icon_x.png" alt="X"></a>`);

  info.innerHTML=`
    <span style="position:absolute; top:5px; right:10px; font-size:20px; cursor:pointer;">&times;</span>
    <p class="item_name">${f.properties.name}</p>
    <p class="item_txt">${f.properties.message}</p>
    <div class="item_img">
      <img src="${mainImage}" style="width:100%; display:block; margin-bottom:5px;">
      <div class="sns-links">${snsLinks.join('')}</div>
      <div><a href="facility.html" id="view-facility-link" class="btn blue">この施設を見る</a></div>
    </div>`;
  info.style.display='block';
  document.getElementById('view-facility-link').addEventListener('click',()=>{sessionStorage.toyosu_manage_facility_id=f.properties.f_id});
}

// --- 初期ロード ---
Promise.resolve()/*匿名ログイン廃止(2026-07-30)*/.then(()=>{
  loadCategories().then(()=>loadFacilityData());
});

map.on('moveend',()=>{updateMarkers(); updateSidebar();});
document.getElementById('info').addEventListener('click',()=>{document.getElementById('info').style.display='none';});

class ResetViewControl{
  onAdd(map){
    this.map = map;

    this.container = document.createElement('div');
    this.container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group';

    const btn = document.createElement('button');
    btn.textContent = '豊洲全体を表示する';
    btn.title = '初期表示位置に戻る';

    btn.addEventListener('click', () => {
      map.flyTo({
        center: initialCenter,
        zoom: initialZoom,
        essential: true
      });
    });

    this.container.appendChild(btn);
    return this.container;
  }

  onRemove(){
    this.container.parentNode.removeChild(this.container);
    this.map = undefined;
  }
}

// ▼Reset
map.addControl(new ResetViewControl(),'top-right');

// ▼＋−
map.addControl(new mapboxgl.NavigationControl({showCompass:false}),'top-right');
</script>
